name: 🚀 Deploy Infrastructure

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Create bucket if it doesn't exist (just for Lambda artifacts)
      - name: Ensure Artifact Bucket exists
        run: |
          aws s3api head-bucket --bucket $ARTIFACT_BUCKET 2>/dev/null \
          || aws s3 mb s3://$ARTIFACT_BUCKET --region $AWS_REGION \
          aws s3api head-bucket --bucket micropizzeria-infra-state 2>/dev/null \
          || aws s3 mb s3://micropizzeria-infra-state --region $AWS_REGION

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"              

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply (create infra and ECR repo)   # ← dummy image
        working-directory: ./infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="container_image=placeholder" \
            -var="image_tag=placeholder" \
            -var="app_version=${{ github.sha }}" \
            -var="lambda_s3_key=marketplace-app-bff/${{ github.sha }}.zip" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="environment=production"

      - name: Build and Push Docker Image   
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/$APP_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$APP_NAME:${{ github.sha }}

      - name: Terraform Apply (update image)   # ←  real image
        working-directory: ./infra
        run: |
          terraform apply -auto-approve -input=false \
            -var="container_image=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="app_version=${{ github.sha }}" \
            -var="lambda_s3_key=marketplace-app-bff/${{ github.sha }}.zip" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="environment=production"
          

      - name: Update ECS Service
        run: echo "ECS service update is handled by Terraform (image set via var.container_image)."