name: 🚀 Deploy Infrastructure

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Create bucket if it doesn't exist (just for Lambda artifacts)
      - name: Ensure Artifact Bucket exists
        run: |
          aws s3api head-bucket --bucket $ARTIFACT_BUCKET 2>/dev/null \
          || aws s3 mb s3://$ARTIFACT_BUCKET --region $AWS_REGION \
          aws s3api head-bucket --bucket micropizzeria-infra-state 2>/dev/null \
          || aws s3 mb s3://micropizzeria-infra-state --region $AWS_REGION

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Mirror xray-daemon to private ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws
          docker pull public.ecr.aws/xray/aws-xray-daemon:latest
          docker tag public.ecr.aws/xray/aws-xray-daemon:latest \
            $ECR_REGISTRY/aws-xray-daemon:latest
          aws ecr describe-repositories --repository-names aws-xray-daemon 2>/dev/null \
          || aws ecr create-repository --repository-name aws-xray-daemon
          docker push $ECR_REGISTRY/aws-xray-daemon:latest  

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"              

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform modules and providers
        uses: actions/cache@v4
        with:
          path: |
            infra/.terraform
            infra/.terraform.lock.hcl
          key: terraform-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Apply (create infra and ECR repo)   # ← dummy image
        working-directory: ./infra
        run: |
          terraform init -input=false

          terraform import \
            'module.ecs.module.cluster.aws_cloudwatch_log_group.this[0]' \
            /aws/ecs/payment-cluster 2>/dev/null || true

          terraform import \
            'module.ecs.module.service["payment"].module.container_definition["payment-api"].aws_cloudwatch_log_group.this[0]' \
            /aws/ecs/payment/payment-api 2>/dev/null || true

          terraform import \
            'module.ecs.module.service["payment"].module.container_definition["xray-daemon"].aws_cloudwatch_log_group.this[0]' \
            /aws/ecs/payment/xray-daemon 2>/dev/null || true

          terraform apply -auto-approve -input=false \
            -var="container_image=placeholder" \
            -var="image_tag=placeholder" \
            -var="app_version=${{ github.sha }}" \
            -var="lambda_s3_key=marketplace-app-bff/${{ github.sha }}.zip" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="environment=production" \
            -var="ecr_registry=${{ steps.login-ecr.outputs.registry }}"

      - name: Build and Push Docker Image   
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/$APP_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$APP_NAME:${{ github.sha }}

      - name: Terraform Apply (update image)   # ←  real image
        working-directory: ./infra
        run: |        
          terraform import \
            'module.ecs.module.cluster.aws_cloudwatch_log_group.this[0]' \
            /aws/ecs/payment-cluster 2>/dev/null || true

          terraform import \
            'module.ecs.module.service["payment"].module.container_definition["payment-api"].aws_cloudwatch_log_group.this[0]' \
            /aws/ecs/payment/payment-api 2>/dev/null || true

          terraform import \
            'module.ecs.module.service["payment"].module.container_definition["xray-daemon"].aws_cloudwatch_log_group.this[0]' \
            /aws/ecs/payment/xray-daemon 2>/dev/null || true

          terraform apply -auto-approve -input=false \
            -var="container_image=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="app_version=${{ github.sha }}" \
            -var="lambda_s3_key=marketplace-app-bff/${{ github.sha }}.zip" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="environment=production" \
            -var="ecr_registry=${{ steps.login-ecr.outputs.registry }}"
          

      - name: Update ECS Service
        run: echo "ECS service update is handled by Terraform (image set via var.container_image)."