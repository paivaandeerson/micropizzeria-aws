name: 🚀 Deploy Infrastructure

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Criar bucket se não existir
      - name: Ensure Artifact Bucket exists
        run: |
          aws s3api head-bucket --bucket $ARTIFACT_BUCKET 2>/dev/null \
          || aws s3 mb s3://$ARTIFACT_BUCKET --region $AWS_REGION

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$APP_NAME" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$APP_NAME"

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/$APP_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$APP_NAME:${{ github.sha }}
          
      - name: Zip Lambda
        working-directory: ./marketplace
        run: zip -r marketplace-app-bff.zip .

      - name: Upload Lambda to S3
        working-directory: ./marketplace
        run: |
          aws s3 cp marketplace-app-bff.zip \
          s3://$ARTIFACT_BUCKET/marketplace-app-bff/${{ github.sha }}.zip

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: ./infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="container_image=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="app_version=${{ github.sha }}" \
            -var="lambda_s3_key=marketplace-app-bff/${{ github.sha }}.zip" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="environment=production"

      - name: Update ECS Service
        run: echo "ECS service update is handled by Terraform (image set via var.container_image)."