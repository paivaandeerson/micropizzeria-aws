name: 🚀 Deploy Infrastructure

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Ensure Artifact Bucket Exists
      - name: Ensure Artifact Bucket exists
        run: |
          aws s3api head-bucket --bucket $ARTIFACT_BUCKET 2>/dev/null \
          || aws s3 mb s3://$ARTIFACT_BUCKET --region $AWS_REGION

      # 4️⃣ Login ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5️⃣ Ensure ECR Repository Exists
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $APP_NAME 2>/dev/null \
          || aws ecr create-repository --repository-name $APP_NAME

      # 6️⃣ Build & Push Docker Image
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/$APP_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$APP_NAME:${{ github.sha }}

      # 7️⃣ Zip Lambda
      - name: Zip Lambda
        working-directory: ./marketplace
        run: zip -r marketplace-app-bff.zip .

      # 8️⃣ Upload Lambda Artifact
      - name: Upload Lambda to S3
        working-directory: ./marketplace
        run: |
          aws s3 cp marketplace-app-bff.zip \
          s3://$ARTIFACT_BUCKET/marketplace-app-bff/${{ github.sha }}.zip

      # 9️⃣ Setup Terraform
      - uses: hashicorp/setup-terraform@v3

      # 🔟 Terraform Apply
      - name: Terraform Apply
        working-directory: ./infra
        run: |
          terraform init -input=false 
          terraform apply -auto-approve -input=false \
            -var="environment=production" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="container_image=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="app_version=${{ github.sha }}"