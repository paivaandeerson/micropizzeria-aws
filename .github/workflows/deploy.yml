name: ✅ Deploy Infrastructure 

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  BUCKET_NAME: "micropizzeria-infra-state"
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ AWS Auth
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Login ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Build Java (kitchen)
      # - name: Set up JDK 21
      #   uses: actions/setup-java@v3
      #   with:
      #     java-version: '21'
      #     distribution: 'temurin'
      #     cache: maven

      # - name: Build JAR
      #   working-directory: ./kitchen
      #   run: mvn clean package -DskipTests

      # 5️⃣ Build Docker (payment ou kitchen dependendo do Dockerfile)
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG

      # 6️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 7️⃣ Terraform Apply com nova tag
      - name: Terraform Init & Apply
        working-directory: ./infra
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"