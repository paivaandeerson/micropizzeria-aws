name: 🚀 Deploy Infrastructure

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Login ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Ensure ECR repository exists
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.APP_NAME }} \
          || aws ecr create-repository --repository-name ${{ env.APP_NAME }}

      # 5️⃣ Build & Push Docker Image (ECS)
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG

      # 6️⃣ Zip Lambda
      - name: Zip Lambda
        working-directory: ./marketplace
        run: zip -r marketplace-app-bff.zip .

      # 7️⃣ Upload Lambda to S3 (Artifacts)
      - name: Upload Lambda to S3
        run: |
          aws s3 cp marketplace-app-bff.zip \
          s3://${{ env.ARTIFACT_BUCKET }}/marketplace-app-bff/${{ github.sha }}.zip

      # 8️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 9️⃣ Terraform Apply (Infra + Deploy)
      - name: Terraform Init & Apply
        working-directory: ./infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="image_tag=${{ github.sha }}" \
            -var="app_version=${{ github.sha }}"