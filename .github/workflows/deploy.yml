name: 🚀 Deploy Infrastructure

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  BUCKET_NAME: "micropizzeria-infra-state"
  AWS_REGION: "us-east-1"
  APP_NAME: "micropizzeria-app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4️⃣ Terraform Apply (Infra Base - garante que ECR existe)
      - name: Terraform Init & Apply (Infra Base)
        working-directory: ./infra
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=init"

      # 5️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6️⃣ Build and Push Docker Image
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./payment
        run: |
          docker build -t $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.APP_NAME }}:$IMAGE_TAG

      # 7️⃣ Terraform Apply (Deploy Nova Imagem)
      - name: Terraform Apply (Deploy Image)
        working-directory: ./infra
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"