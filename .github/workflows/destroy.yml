name: 💣 Destroy Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3

      - name: Empty Artifact Bucket
        run: aws s3 rm s3://$ARTIFACT_BUCKET --recursive || true

      - name: Empty ECR Repository
        run: |
          aws ecr list-images \
            --repository-name micropizzeria-app \
            --query 'imageIds[*]' \
            --output json | \
          jq 'if length > 0 then . else empty end' | \
          xargs -I{} aws ecr batch-delete-image \
            --repository-name micropizzeria-app \
            --image-ids {} || true

      - name: Stop ECS tasks and wait ENIs release
        run: |
          # Para todas as tasks
          for TASK in $(aws ecs list-tasks \
            --cluster payment-cluster \
            --region $AWS_REGION \
            --query "taskArns[*]" --output text 2>/dev/null); do
            echo "Stopping task: $TASK"
            aws ecs stop-task \
              --cluster payment-cluster \
              --task $TASK \
              --region $AWS_REGION > /dev/null
          done

          # Aguarda até não haver mais ENIs in-use do ECS (timeout 5min)
          echo "Waiting for ENIs to be released..."
          for i in $(seq 1 30); do
            ENI_COUNT=$(aws ec2 describe-network-interfaces \
              --region $AWS_REGION \
              --filters "Name=status,Values=in-use" \
                        "Name=description,Values=*ecs*" \
              --query "length(NetworkInterfaces)" \
              --output text)
            echo "  ENIs still in-use: $ENI_COUNT (attempt $i/30)"
            if [ "$ENI_COUNT" = "0" ]; then
              echo "  ✅ All ENIs released."
              break
            fi
            sleep 10
          done 

      - name: Delete dangling ENIs
        run: |
          ENI_IDS=$(aws ec2 describe-network-interfaces \
            --region $AWS_REGION \
            --filters "Name=status,Values=available" \
                      "Name=description,Values=*payment*" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" \
            --output text)
          for ENI in $ENI_IDS; do
            echo "Deleting ENI: $ENI"
            aws ec2 delete-network-interface \
              --network-interface-id $ENI \
              --region $AWS_REGION || true
          done

          # ENIs da Lambda (descrição diferente)
          ENI_IDS_LAMBDA=$(aws ec2 describe-network-interfaces \
            --region $AWS_REGION \
            --filters "Name=status,Values=available" \
                      "Name=description,Values=*marketplace-app-bff*" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" \
            --output text)
          for ENI in $ENI_IDS_LAMBDA; do
            echo "Deleting ENI: $ENI"
            aws ec2 delete-network-interface \
              --network-interface-id $ENI \
              --region $AWS_REGION || true
          done

      - name: Terraform Destroy
        working-directory: ./infra
        run: |
          terraform init -input=false
          terraform state rm module.ecs || true
          terraform destroy -auto-approve -input=false \
            -var="container_image=dummy" \
            -var="image_tag=dummy" \
            -var="app_version=dummy" \
            -var="lambda_s3_key=dummy" \
            -var="artifact_bucket=dummy" \
            -var="environment=production" \
            -var="ecr_registry=$ECR_REGISTRY"

      - name: Empty Artifact Bucket
        run: aws s3 rm s3://$ARTIFACT_BUCKET --recursive || true

      - name: Delete Artifact Bucket
        run: aws s3 rb s3://$ARTIFACT_BUCKET || true