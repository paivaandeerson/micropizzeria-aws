name: 💣 Destroy Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ARTIFACT_BUCKET: "micropizzeria-artifacts"  

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.actor == 'paivaandeerson'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3

      - name: Empty Artifact Bucket
        run: aws s3 rm s3://$ARTIFACT_BUCKET --recursive || true

      - name: Empty and delete ECR Repositories
        run: |
          for REPO in micropizzeria-app aws-xray-daemon; do
            echo "Processing ECR repo: $REPO"
            IMAGE_IDS=$(aws ecr list-images \
              --repository-name $REPO \
              --region $AWS_REGION \
              --query 'imageIds[*]' \
              --output json 2>/dev/null)

            if [ "$IMAGE_IDS" != "[]" ] && [ -n "$IMAGE_IDS" ]; then
              echo "  → Deleting images from $REPO..."
              aws ecr batch-delete-image \
                --repository-name $REPO \
                --image-ids "$IMAGE_IDS" \
                --region $AWS_REGION > /dev/null
            fi

            aws ecr delete-repository \
              --repository-name $REPO \
              --force \
              --region $AWS_REGION 2>/dev/null \
              && echo "  ✅ $REPO deleted." || echo "  ⚠️ $REPO not found, skipping."
          done

      - name: Delete ECS Service
        run: |
          aws ecs update-service \
            --cluster payment-cluster \
            --service payment \
            --desired-count 0 \
            --region $AWS_REGION 2>/dev/null || true
          aws ecs delete-service \
            --cluster payment-cluster \
            --service payment \
            --force \
            --region $AWS_REGION 2>/dev/null || true     

      - name: Stop ECS tasks and wait ENIs release
        run: |          
          for TASK in $(aws ecs list-tasks \
            --cluster payment-cluster \
            --region $AWS_REGION \
            --query "taskArns[*]" --output text 2>/dev/null); do
            echo "Stopping task: $TASK"
            aws ecs stop-task \
              --cluster payment-cluster \
              --task $TASK \
              --region $AWS_REGION > /dev/null
          done
          
          echo "Waiting for ENIs to be released..."
          for i in $(seq 1 30); do
            ENI_COUNT=$(aws ec2 describe-network-interfaces \
              --region $AWS_REGION \
              --filters "Name=status,Values=in-use" \
                        "Name=description,Values=*ecs*" \
              --query "length(NetworkInterfaces)" \
              --output text)
            echo "  ENIs still in-use: $ENI_COUNT (attempt $i/30)"
            if [ "$ENI_COUNT" = "0" ]; then
              echo "  ✅ All ENIs released."
              break
            fi
            sleep 10
          done 

      - name: Delete dangling ENIs
        run: |
          ENI_IDS=$(aws ec2 describe-network-interfaces \
            --region $AWS_REGION \
            --filters "Name=status,Values=available" \
                      "Name=description,Values=*payment*" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" \
            --output text)
          for ENI in $ENI_IDS; do
            echo "Deleting ENI: $ENI"
            aws ec2 delete-network-interface \
              --network-interface-id $ENI \
              --region $AWS_REGION || true
          done

          # ENIs da Lambda 
          ENI_IDS_LAMBDA=$(aws ec2 describe-network-interfaces \
            --region $AWS_REGION \
            --filters "Name=status,Values=available" \
                      "Name=description,Values=*marketplace-app-bff*" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" \
            --output text)
          for ENI in $ENI_IDS_LAMBDA; do
            echo "Deleting ENI: $ENI"
            aws ec2 delete-network-interface \
              --network-interface-id $ENI \
              --region $AWS_REGION || true
          done

      - name: Delete orphan Security Groups
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --region $AWS_REGION \
            --filters "Name=tag:Name,Values=main-vpc" \
            --query "Vpcs[0].VpcId" \
            --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "VPC not found, skipping."
            exit 0
          fi

          echo "Found VPC: $VPC_ID"

          SG_IDS=$(aws ec2 describe-security-groups \
            --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?GroupName!='default'].GroupId" \
            --output text)

          for SG in $SG_IDS; do
            echo "Deleting SG: $SG"
            aws ec2 delete-security-group \
              --group-id $SG \
              --region $AWS_REGION 2>/dev/null || echo "  ⚠️ SG $SG still has dependencies, skipping."
          done    

      - name: Delete ECS Log Groups
        run: |
          for LG in \
            /aws/ecs/payment-cluster \
            /aws/ecs/payment/payment-api \
            /aws/ecs/payment/xray-daemon; do
            echo "Deleting log group: $LG"
            aws logs delete-log-group \
              --log-group-name $LG \
              --region $AWS_REGION 2>/dev/null || echo "  ⚠️ $LG not found, skipping."
          done    
          
      - name: Delete ECS Autoscaling Target
        run: |
          aws application-autoscaling deregister-scalable-target \
            --service-namespace ecs \
            --resource-id service/payment-cluster/payment \
            --scalable-dimension ecs:service:DesiredCount \
            --region $AWS_REGION 2>/dev/null || true    

      - name: Terraform Destroy
        working-directory: ./infra
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          terraform init -input=false
          terraform destroy -auto-approve -input=false \
            -var="container_image=dummy" \
            -var="image_tag=dummy" \
            -var="app_version=dummy" \
            -var="lambda_s3_key=dummy" \
            -var="artifact_bucket=${{ env.ARTIFACT_BUCKET }}" \
            -var="environment=production" \
            -var="ecr_registry=$ECR_REGISTRY"

      - name: Empty Artifact Bucket
        run: aws s3 rm s3://$ARTIFACT_BUCKET --recursive || true

      - name: Delete Artifact Bucket
        run: aws s3 rb s3://$ARTIFACT_BUCKET || true